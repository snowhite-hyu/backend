apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowhite-deployment
  namespace: snowhite-dev
spec:
  selector:
    matchLabels:
      app: snowhite
  replicas: 1
  template:
    metadata:
      labels:
        app: snowhite
    spec:
      containers:
        - name: snowhite
          image: registry.ryuuga.duckdns.org/snowhite/backend:latest
          command: ["sh", "-c", "cp /backend-env/.env .env && java -jar *-SNAPSHOT.jar"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: backend-env
              mountPath: /backend-env
              readOnly: true
      volumes:
        - name: backend-env
          configMap:
            name: backend-configmap
            items:
            - key: ".env"
              path: ".env"
---
apiVersion: v1
kind: Service
metadata:
  name: snowhite-service
  namespace: snowhite-dev
spec:
  selector:
    app: snowhite
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
