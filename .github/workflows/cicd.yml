name: Dev CI/CD

on:
  push:
    branches: [ "develop" ]

jobs:
  dev-deployment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: snowhite

      - name: Move Artifact
        run: |
          mkdir -p build/libs/
          mv *.jar build/libs/

      - name: Generate .env
        run: |
          echo "${{ secrets.ENV }}" > .env
          echo "${{ secrets.MYSQL_ENV }}" > mysql.env
      
      - name: Docker update
        run: sudo apt-get update && sudo apt-get install docker-ce docker-ce-cli containerd.io

      - name: Docker Login
        run: echo "${{ secrets.GITLAB_PASSWORD }}" | docker login registry.ryuuga.duckdns.org -u "${{ secrets.GITLAB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker buildx build --load --platform linux/arm64 -t snowhite/backend:latest .

      - name: Tag Docker Image
        run: docker image tag snowhite/backend:latest registry.ryuuga.duckdns.org/snowhite/backend:latest

      - name: Push Docker Image
        run: docker push registry.ryuuga.duckdns.org/snowhite/backend:latest
